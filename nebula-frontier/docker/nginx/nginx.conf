# Edge config. In production Cloudflare terminates TLS in front of this.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream api { server api:8080; keepalive 32; }
upstream game { ip_hash; server game-server:2567; }

server {
  listen 80;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 1m;

  location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /health { proxy_pass http://api/health; }

  # Colyseus websocket + matchmaking HTTP
  location /game/ { rewrite ^/game/(.*)$ /$1 break; proxy_pass http://game; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host; proxy_read_timeout 3600s; }

  location /admin/ { alias /usr/share/nginx/admin/; try_files $uri $uri/ /admin/index.html; }
  location /assets/ { root /usr/share/nginx/html; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
