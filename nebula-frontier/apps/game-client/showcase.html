<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Frontier — Renderer Showcase</title>
    <style>
      html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; font-family: system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #view canvas { width: 100%; height: 100%; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, 0); color: #cfe3ff; font-size: 11px; letter-spacing: .04em; text-shadow: 0 1px 3px #000; white-space: nowrap; }
      #hud { position: fixed; left: 8px; top: 8px; color: #8fb4ff; font: 12px monospace; }
    </style>
  </head>
  <body>
    <div id="view"><canvas id="c"></canvas></div>
    <div id="labels"></div>
    <div id="hud"></div>
    <script type="module" src="/src/showcase.ts"></script>
  </body>
</html>
