# Local development stack: PostgreSQL, Redis, API, Game Server, Blockchain Service, Web (nginx).
# Secrets come from .env (never committed). Blockchain is DEVNET only.
name: nebula-frontier
services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment: { POSTGRES_USER: nebula, POSTGRES_PASSWORD: nebula, POSTGRES_DB: nebula }
    ports: ["5432:5432"]
    # WAL archiving (base for point-in-time recovery together with the daily dumps below). Segments are
    # published atomically (copy to .tmp, then rename) so a restore never replays a partial segment;
    # archive_timeout=60 bounds the RPO of a low-traffic server to ~1 min. Drill: scripts/backup/pitr-drill.sh.
    command: ["sh", "-c", "mkdir -p /wal-archive && chown postgres:postgres /wal-archive && exec docker-entrypoint.sh postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=60 -c 'archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f'"]
    volumes: [pgdata:/var/lib/postgresql/data, walarchive:/wal-archive]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nebula"], interval: 5s, retries: 20 }
  backup:
    restart: unless-stopped
    image: postgres:16-alpine
    # Daily pg_dump (custom format, verified, sha256) with 30-day retention: scripts/backup/pg-backup.sh
    command: ["sh", "-c", "while true; do /scripts/pg-backup.sh || echo 'backup FAILED'; sleep 86400; done"]
    environment: { DATABASE_URL: "postgresql://nebula:nebula@postgres:5432/nebula", BACKUP_DIR: /backups, RETENTION_DAYS: "30" }
    volumes: ["./scripts/backup:/scripts:ro", "backups:/backups"]
    depends_on: { postgres: { condition: service_healthy } }
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
  migrate:
    build: { context: ., dockerfile: docker/node.Dockerfile, target: build, args: { APP: api } }
    command: ["sh", "-c", "pnpm prisma migrate deploy && pnpm db:seed"]
    env_file: .env
    environment: { DATABASE_URL: postgresql://nebula:nebula@postgres:5432/nebula }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: api } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nebula:nebula@postgres:5432/nebula
      REDIS_URL: redis://redis:6379
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8090
      PORT_HEALTH: "8080"
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  game-server:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: game-server } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nebula:nebula@postgres:5432/nebula
      REDIS_URL: redis://redis:6379
      PORT_HEALTH: "2567"
    ports: ["2567:2567"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  blockchain-service:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: blockchain-service } }
    env_file: .env
    environment:
      SERVICE_ROLE: blockchain
      DATABASE_URL: postgresql://nebula:nebula@postgres:5432/nebula
      REDIS_URL: redis://redis:6379
      PORT_HEALTH: "8090"
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  web:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["8088:80"]
    depends_on: [api, game-server]
volumes: { pgdata: {}, redisdata: {}, walarchive: {}, backups: {} }
