[package]
name = "nebula_settlement"
version = "0.1.0"
description = "NEBULA FRONTIER settlement program (reward verification, escrow, tournament settlement) — not deployed in MVP"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "nebula_settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
